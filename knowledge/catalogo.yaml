fuentes:
- id: S01
  referencia_markdown: Servicio Nacional de Sanidad Agraria. (2020). *Guía para la
    implementación de buenas prácticas agrícolas para el cultivo de maíz amarillo
    duro*, pp. 30–31. [Documento oficial](https://www.senasa.gob.pe/senasa/descargasarchivos/2020/07/Guia-BPA-MAIZ-AMARILLO-DURO.pdf).
- id: S02
  referencia_markdown: Servicio Nacional de Sanidad Agraria. (s. f.). *Guía sobre
    almacenamiento*, secciones 3.1–3.6. [Documento oficial](https://www.senasa.gob.pe/senasa/descargasarchivos/2014/12/GUIA-ALMACENAMIENTO.pdf).
- id: S03
  referencia_markdown: 'Food and Agriculture Organization of the United Nations. (s.
    f.). *Agricultural engineering in development: Storage*. [Capítulo](https://www.fao.org/4/t0522e/T0522E09.htm).'
- id: S04
  referencia_markdown: Codex Alimentarius Commission. (2017). *Code of practice for
    the prevention and reduction of mycotoxin contamination in cereals* (CXC 51-2003),
    párrs. 37–39. [Documento oficial](https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%3A%2F%2Fworkspace.fao.org%2Fsites%2Fcodex%2FStandards%2FCXC+51-2003%2FCXC_051e.pdf).
- id: S05
  referencia_markdown: 'Food and Agriculture Organization of the United Nations. (s.
    f.). *Manual of the prevention of post-harvest grain losses: Central storage*,
    secciones 5.2.4.2–5.2.4.3. [Manual](https://www.fao.org/4/x5065e/x5065E0a.htm).'
- id: S06
  referencia_markdown: Purdue Extension. (2015). *A guide on the use of PICS bags*
    (E-265-W). [Guía](https://extension.entm.purdue.edu/publications/E-265.pdf).
- id: S07
  referencia_markdown: Hellevang, K., & Proulx, R. (2026, 27 de febrero). *Proper
    grain storage crucial in late winter and spring*. North Dakota State University
    Extension. [Artículo](https://www.ag.ndsu.edu/news/newsreleases/2026/february/proper-grain-storage-crucial-in-late-winter-and-spring).
- id: S08
  referencia_markdown: North Dakota State University Extension. (s. f.). *Allowable
    storage time for cereal grains, malting barley and soybeans*. [Tabla de referencia](https://www.ndsu.edu/agriculture/ag-hub/allowable-storage-time-cereal-grains-malting-barley-and-soybeans).
- id: S09
  referencia_markdown: Food and Agriculture Organization of the United Nations & World
    Health Organization. (2026). *Standard for maize (corn)* (CXS 153-1985, enmienda
    2026 según el catálogo oficial). [Registro](https://openknowledge.fao.org/handle/20.500.14283/ce0295en).
    [Catálogo oficial](https://www.fao.org/fao-who-codexalimentarius/codex-texts/all-standards/en/).
    Los porcentajes comerciales se conservan de la propuesta original; confirmar edición,
    métodos y aplicabilidad al tipo de chulpi antes del uso productivo.
