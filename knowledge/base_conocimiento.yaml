calculos:
  temperatura_grano_aplicable:
    descripcion: 'Escenario de planificación hermético sin apertura (sección 6.2):
      la mayor entre la última temperatura interna válida y la máxima ambiental documentada.'
    aplica_estimacion: aplica_estimacion_hermetica
  tiempo:
    tabla: tiempo_referencia
    parametro_limite: vida_limite
  plazo_compatible:
    parametro_limite: vida_limite
    parametro_limite_calido: limite_calido_dias
    parametro_plazo_condicional: plazo_corto_max_dias
    hecho_condicional: HUMEDAD_CONDICIONAL
  proximo_control:
    parametro_riesgo: control_con_riesgo_dias
    parametro_hermetico: control_exterior_dias
    parametro_no_hermetico: control_no_hermetico_dias
definiciones:
  medicion_confirmada:
    descripcion: Medición de humedad con método válido, equipo verificado, muestra
      representativa y procedimiento cumplido
    guarda:
      campo: metodo_humedad
      entonces:
        todos:
        - dato: metodo_humedad
          en:
          - INSTRUMENTAL
          - LABORATORIO
          descripcion: método instrumental o de laboratorio
        - dato: equipo_humedad_verificado
          descripcion: equipo verificado
        - dato: muestra_representativa
          descripcion: muestra representativa
        - dato: procedimiento_medicion_cumplido
          descripcion: procedimiento cumplido
        - implica:
            si:
              dato: metodo_humedad
              op: EQ
              valor: INSTRUMENTAL
            entonces:
              dato: temperatura_muestra
              op: GTE
              valor:
                param: muestra_fria_umbral
          descripcion: muestra no fría para el medidor
  integridad_hermetica:
    descripcion: Barrera hermética comprobada
    implica:
      si:
        contexto: tipo_almacenamiento
        igual: HERMETICO
      entonces:
        todos:
        - dato: sello_integro
          descripcion: sello íntegro
        - dato: cierre_seguro
          descripcion: cierre seguro
        - negar:
            dato: perforacion_barrera
          descripcion: sin perforación
        - negar:
            dato: bolsa_abierta_sin_resellar
          descripcion: sin apertura sin resellar
        - negar:
            inconsistencia: hermeticidad
          descripcion: sin contradicción registrada sobre la barrera
  aplica_estimacion_hermetica:
    descripcion: Hermético sin sensor interno y con barrera comprobada
    todos:
    - contexto: tipo_almacenamiento
      igual: HERMETICO
    - negar:
        es_verdadero:
          dato: sensor_interno_hermetico
    - es_verdadero:
        definicion: integridad_hermetica
  recipiente_apto:
    descripcion: Recipiente limpio, seco, de grado alimentario, resistente y con cierre
      seguro
    todos:
    - dato: recipiente_limpio
      descripcion: recipiente limpio
    - dato: recipiente_seco
      descripcion: recipiente seco
    - dato: material_grado_alimentario
      descripcion: material de grado alimentario
    - dato: recipiente_resistente
      descripcion: recipiente resistente
    - dato: cierre_seguro
      descripcion: cierre seguro
  estiba_apta:
    descripcion: Separaciones mínimas a piso, pared y techo
    todos:
    - dato: distancia_piso
      op: GTE
      valor:
        param: estiba_piso_min
      descripcion: separación del piso
    - dato: distancia_pared
      op: GTE
      valor:
        param: estiba_pared_min
      descripcion: separación de la pared
    - dato: distancia_techo
      op: GTE
      valor:
        param: estiba_techo_min
      descripcion: separación del techo
  almacen_higienico:
    descripcion: Limpieza exigible vigente
    todos:
    - vigente_meses: fecha_limpieza_general
      meses: 1
      descripcion: limpieza general en el último mes
    - dato: limpieza_diaria
      descripcion: limpieza diaria
    - dato: limpieza_tras_operaciones
      descripcion: limpieza tras operaciones
    - implica:
        si:
          contexto: fase
          igual: INGRESO
        entonces:
          dato: limpieza_previa_nuevo_lote
      descripcion: limpieza previa al nuevo lote
  calidad_aire_adecuada:
    descripcion: Sin contaminantes ni productos incompatibles
    todos:
    - negar:
        dato: polvo_humo_gases_vapores
      descripcion: sin polvo, humo, gases o vapores
    - negar:
        dato: quimicos_combustibles_en_almacen
      descripcion: sin químicos ni combustibles
  calidad_fisica_conforme:
    descripcion: Calidad física dentro del cribado comercial
    todos:
    - dato: suciedad_origen_animal
      op: LTE
      valor:
        param: suciedad_animal_max
      descripcion: suciedad de origen animal
    - negar:
        dato: heces_visibles
      descripcion: sin heces visibles
    - dato: granos_defectuosos
      op: LTE
      valor:
        param: defectuosos_max
      descripcion: granos defectuosos
    - dato: granos_enfermos
      op: LTE
      valor:
        param: enfermos_max
      descripcion: granos enfermos
    - dato: granos_quebrados
      op: LTE
      valor:
        param: quebrados_max
      descripcion: granos quebrados
    - dato: materia_organica_extrana
      op: LTE
      valor:
        param: materia_organica_max
      descripcion: materia orgánica extraña
    - dato: materia_inorganica_extrana
      op: LTE
      valor:
        param: materia_inorganica_max
      descripcion: materia inorgánica extraña
  indicio_r15_residual:
    descripcion: Indicios de insectos no explicados por un descarte válido
    alguno:
    - todos:
      - &id001
        alguno:
        - dato: granos_perforados
        - dato: polvillo_inusual
        - dato: exuvias_larvas
        - dato: ruido_alimentacion
      - negar:
          todos:
          - dato: resultado_revision_plagas
            op: EQ
            valor: DESCARTADA
          - dato: revision_plagas_cubre_indicios_actuales
    - todos:
      - es_desconocido: *id001
      - constante: DESCONOCIDO
  sin_evidencia_de_plagas:
    descripcion: Sin signos de plagas ni episodio de revisión abierto
    todos:
    - negar:
        dato: insectos_vivos
      descripcion: sin insectos vivos
    - negar:
        dato: heces_roedores_aves_entorno
      descripcion: sin heces de roedores o aves
    - negar:
        dato: huellas
      descripcion: sin huellas
    - negar:
        dato: bolsa_roida
      descripcion: sin envase roído
    - negar:
        dato: grano_derramado_por_plaga
      descripcion: sin grano derramado por plaga
    - negar:
        definicion: indicio_r15_residual
      descripcion: sin indicios residuales de insectos
    - negar:
        episodio:
        - REVISION_PLAGAS
      descripcion: sin revisión de plagas abierta
  sin_evidencia_de_deterioro:
    descripcion: Sin indicios de deterioro ni cuarentena abierta
    todos:
    - negar:
        dato: moho_visible
      descripcion: sin moho visible
    - negar:
        dato: olor_anormal
      descripcion: sin olor anormal
    - negar:
        dato: condensacion_interna
      descripcion: sin condensación interna
    - negar:
        dato: germinacion
      descripcion: sin germinación
    - negar:
        episodio:
        - CUARENTENA
      descripcion: sin cuarentena abierta
  aw_sin_alerta:
    descripcion: Actividad de agua no medida o bajo el umbral de alerta
    guarda:
      campo: aw_medida
      entonces:
        alguno:
        - es_falso:
            dato: aw_medida
        - dato: actividad_agua
          op: LT
          valor:
            param: aw_alerta
  ambiente_base_apto:
    descripcion: Ambiente del almacén dentro de la condición base (R06)
    alguno:
    - hecho: AMBIENTE_BASE_APTO
    - todos:
      - negar:
          hecho: RIESGO_REHUMEDECIMIENTO
      - negar:
          hecho: RIESGO_TERMICO
      - constante: DESCONOCIDO
  temperatura_bajo_alerta:
    descripcion: Temperatura del grano por debajo de la alerta
    dato: temperatura_grano_aplicable
    op: LT
    valor:
      param: temperatura_alerta
  lecturas_termicas_comparables:
    descripcion: Dos lecturas del mismo punto y método dentro de la ventana permitida
    todos:
    - dato: punto_medicion
      op: EQ
      valor:
        dato: punto_medicion_previo
    - dato: metodo_termico
      op: EQ
      valor:
        dato: metodo_termico_previo
    - horas_entre:
      - temperatura_grano
      - temperatura_grano_previa
      op: GT
      valor: 0
    - horas_entre:
      - temperatura_grano
      - temperatura_grano_previa
      op: LTE
      valor:
        param: intervalo_termico_max_horas
  datos_aireacion_completos:
    descripcion: Medición confirmada y lecturas exteriores simultáneas con tabla de
      equilibrio
    todos:
    - definicion: medicion_confirmada
    - presentes:
      - temperatura_grano
      - hr_aire_exterior
      - temperatura_aire_exterior
      - lluvia_o_niebla
      - humedad_equilibrio_maiz
      - tabla_equilibrio_id
  riesgo_activo:
    descripcion: Hay un hallazgo adverso, una incidencia abierta o faltan comprobaciones
      de riesgo
    alguno:
    - algun_hecho:
      - HUMEDAD_NO_APTA
      - HUMEDAD_CONDICIONAL
