restricciones:
- menor: humedad_base_max
  que: humedad_admision_max
  motivo: la condición base debe quedar por debajo del máximo de admisión
- menor: vida_alerta
  que: vida_limite
  motivo: el aviso preventivo debe llegar antes del agotamiento
- menor: insectos_temperatura_min
  que: insectos_temperatura_max
  motivo: el rango favorable a insectos debe tener un mínimo menor que el máximo
- menor: control_con_riesgo_dias
  que: control_no_hermetico_dias
  igual: true
  motivo: con riesgo activo el control no puede espaciarse más que sin riesgo
- menor: control_con_riesgo_dias
  que: control_exterior_dias
  igual: true
  motivo: con riesgo activo el control no puede espaciarse más que sin riesgo
- menor: control_con_riesgo_dias
  que: control_almacen_dias
  igual: true
  motivo: con riesgo activo el control no puede espaciarse más que sin riesgo
- menor: enfermos_max
  que: defectuosos_max
  igual: true
  motivo: los granos enfermos son un subconjunto de los defectuosos
- entre: aw_alerta
  minimo: 0
  maximo: 1
  motivo: la actividad de agua es una fracción
- entre: vida_alerta
  minimo: 0
  maximo: 1
  motivo: la vida consumida es una fracción
