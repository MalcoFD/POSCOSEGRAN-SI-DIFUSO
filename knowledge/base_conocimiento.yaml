        nombre: Hallazgo documental que requiere corrección
        condicion:
          solicitud: CORRECCION
      pendientes:
        nombre: Evidencia aplicable pendiente
        condicion:
          pendientes: true
      evidencia:
        nombre: Evidencia suficiente para autorizar
        condicion:
          es_verdadero:
            todos:
            - definicion: condiciones_comunes_aptas
            - calculo: plazo_compatible
            - alguno:
