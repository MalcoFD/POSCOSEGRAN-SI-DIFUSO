    estado_fisico_sanitario:
      nombre: Estado físico y sanitario del grano
      unidad: categoría
      unidad_dato: TEXTO
      tipo: CATEGORICA
      dominio:
      - SIN_HALLAZGOS
      - DANO_FISICO
      - INDICIOS_BIOLOGICOS
      - HALLAZGO_CRITICO
      conjuntos:
        SIN_HALLAZGOS:
          valor: SIN_HALLAZGOS
        DANO_FISICO:
          valor: DANO_FISICO
        INDICIOS_BIOLOGICOS:
          valor: INDICIOS_BIOLOGICOS
        HALLAZGO_CRITICO:
          valor: HALLAZGO_CRITICO
      fuentes:
      - S02
      - S04
      - S06
      - S09
      protocolo:
        SIN_HALLAZGOS: Inspección documentada sin daño físico relevante, indicios
          de plagas, moho visible ni insectos vivos. Ausencia de inspección no pertenece
          a este estado.
        DANO_FISICO: Daño físico observado que requiere limpieza o clasificación,
          sin indicios biológicos ni hallazgo crítico. Describir muestra, tipo de
          defecto y proporción cuando se mida.
        INDICIOS_BIOLOGICOS: Perforaciones anormales, polvillo o restos compatibles
          con plagas, sin insectos vivos ni moho observado. Es una sospecha, no un
          diagnóstico de infestación.
        HALLAZGO_CRITICO: Moho visible o insectos vivos observados en el grano. Documentar
          el hallazgo; requiere separación y evaluación técnica. No cuantifica micotoxinas.
      fundamento: Cuatro categorías operativas del prototipo, ingresadas directamente
        por el inspector. Funciones características 0/1; no son cuatro grados continuos
        de contaminación.
