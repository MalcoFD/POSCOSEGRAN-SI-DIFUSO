        - vencimiento_aplicable
  con_riesgo:
    descripcion: 'Riesgo activo o desconocido: acorta los plazos de control'
    no_falso:
      definicion: riesgo_activo
  plazo_ingreso_vencido:
    descripcion: inspección de ingreso
    implica:
      si:
        contexto: fase
        igual: INGRESO
      entonces:
        negar:
          dato: ingreso_inspeccionado
  plazo_grano_vencido:
    descripcion: inspección del grano
    implica:
      si:
        todos:
        - negar:
            contexto: fase
            igual: INGRESO
        - contexto: tipo_almacenamiento
          igual: NO_HERMETICO
      entonces:
        vencido_dias: fecha_inspeccion_grano
        dias:
          elegir:
            si:
              definicion: con_riesgo
            entonces:
              param: control_con_riesgo_dias
            sino:
              param: control_no_hermetico_dias
  plazo_exterior_vencido:
    descripcion: inspección exterior del recipiente hermético
    implica:
      si:
        todos:
        - negar:
            contexto: fase
            igual: INGRESO
        - contexto: tipo_almacenamiento
          igual: HERMETICO
      entonces:
        vencido_dias: fecha_inspeccion_exterior
        dias:
          elegir:
            si:
              definicion: con_riesgo
            entonces:
              param: control_con_riesgo_dias
            sino:
              param: control_exterior_dias
  plazo_almacen_vencido:
    descripcion: control del almacén
    vencido_dias: fecha_control_almacen
    dias:
      elegir:
        si:
          definicion: con_riesgo
        entonces:
          param: control_con_riesgo_dias
        sino:
          param: control_almacen_dias
  control_vigente:
    descripcion: Ningún control vencido ni invalidado por un evento posterior
    todos:
    - negar:
        es_verdadero:
          dato: hay_evento_que_invalida_control
      descripcion: sin evento posterior que invalide los controles
    - negar:
        definicion: plazo_ingreso_vencido
      descripcion: inspección de ingreso realizada
    - negar:
        definicion: plazo_grano_vencido
      descripcion: inspección del grano en plazo
    - negar:
        definicion: plazo_exterior_vencido
      descripcion: inspección exterior en plazo
    - negar:
        definicion: plazo_almacen_vencido
      descripcion: control del almacén en plazo
  condiciones_comunes_aptas:
    descripcion: Condiciones comunes a toda autorización
    todos:
    - definicion: recipiente_apto
      descripcion: recipiente apto
    - definicion: estiba_apta
      descripcion: estiba apta
    - definicion: almacen_higienico
      descripcion: almacén higiénico
    - definicion: calidad_aire_adecuada
      descripcion: calidad del aire adecuada
    - definicion: calidad_fisica_conforme
      descripcion: calidad física conforme
    - definicion: sin_evidencia_de_plagas
      descripcion: sin evidencia de plagas
    - definicion: sin_evidencia_de_deterioro
      descripcion: sin evidencia de deterioro
    - definicion: aw_sin_alerta
      descripcion: actividad de agua sin alerta
    - definicion: ambiente_base_apto
      descripcion: ambiente del almacén apto
    - definicion: control_vigente
      descripcion: controles vigentes
    - definicion: medicion_confirmada
      descripcion: medición de humedad confirmada
    - definicion: temperatura_bajo_alerta
      descripcion: temperatura del grano bajo la alerta
    - alguno:
      - contexto: tipo_almacenamiento
        definido: true
      - constante: DESCONOCIDO
      descripcion: modalidad de almacenamiento definida
  banda_condicional_admisible:
    descripcion: Banda condicional de humedad admisible (sección 7.2)
    implica:
      si:
        hecho: HUMEDAD_CONDICIONAL
      entonces:
        todos:
        - contexto: tipo_almacenamiento
          igual: NO_HERMETICO
          descripcion: la banda condicional solo se admite en almacenamiento no hermético
        - es_falso:
            contexto: clima_calido
          descripcion: se exige clima no cálido documentado
        - es_verdadero:
            calculo: dias_previstos_restantes
            op: LTE
            valor:
              param: plazo_corto_max_dias
          descripcion: plazo restante conocido y dentro del plazo corto
        - es_verdadero:
            definicion: condiciones_comunes_aptas
          descripcion: las condiciones comunes deben estar comprobadas
        - es_verdadero:
            calculo: plazo_compatible
          descripcion: el plazo debe ser compatible con el tiempo de referencia
        - es_verdadero:
            calculo: dictamen_cubre
          descripcion: falta un dictamen técnico vigente para ese rango y plazo
        - es_verdadero:
            calculo: plan_vigente
          descripcion: falta un plan de monitoreo registrado y vigente
        - es_verdadero:
            calculo: plan_intervalo_dias
            op: LTE
            valor:
              param: intervalo_plan_condicional_max_dias
          descripcion: el plan debe fijar control como máximo cada 7 días
        - es_verdadero:
            calculo: plan_salida_definida
          descripcion: el plan debe fijar fecha de salida
  proteccion_requerida:
    descripcion: No hermético, o hermético con protección activa (R12)
    alguno:
    - contexto: tipo_almacenamiento
      igual: NO_HERMETICO
    - hecho: PROTECCION_HERMETICA_ACTIVA
    - constante: DESCONOCIDO
etapas:
- validacion
- encadenamiento
- tiempo
- aviso_tiempo
- control
- consolidacion
reglas:
- id: VALIDACION-inconsistencias
  regla: VALIDACION
  etapa: validacion
  si:
    alguno:
    - todos:
      - dato: sello_integro
      - alguno:
        - dato: perforacion_barrera
        - dato: bolsa_abierta_sin_resellar
      descripcion: sello declarado íntegro con barrera perforada o abierta
    - todos:
      - dato: insectos_vivos
      - dato: resultado_revision_plagas
        op: EQ
        valor: DESCARTADA
      descripcion: insectos vivos con revisión de plagas descartada
    - dato: granos_enfermos
      op: GT
      valor:
        dato: granos_defectuosos
      descripcion: granos enfermos superan a los defectuosos
    - inconsistencia: '*'
  entonces:
    hallazgo: DATOS_INCONSISTENTES
    solicitudes:
    - CORRECCION
    mensaje: 'Hay registros contradictorios: {soportes}. Se conserva el indicio adverso
      y se solicita revisión.'
- id: VALIDACION-invalidos
  regla: VALIDACION
  etapa: validacion
  si:
    hay_invalidos: true
  entonces:
    hallazgo: DATOS_INVALIDOS
    solicitudes:
    - CORRECCION
    mensaje: 'Datos inválidos o vencidos que no participan en comparaciones: {invalidos}.'
- id: R01
  si:
    todos:
    - definicion: medicion_confirmada
    - dato: humedad_grano
      op: GT
      valor:
        param: humedad_admision_max
  entonces:
    hallazgo: HUMEDAD_NO_APTA
    solicitudes:
    - SUSPENSION
    mensaje: 'Humedad confirmada {dato:humedad_grano} % b.h. supera el máximo de admisión
      de {param:humedad_admision_max} %: no procede la {ingreso?admisión|permanencia
      normal}.'
    accion:
      codigo: CORREGIR
      descripcion: Secar el lote, medir de nuevo y volver a evaluar.
      responsable: PRODUCTOR
  evidencias:
  - dato: humedad_grano
    op: GT
    valor:
      param: humedad_admision_max
- id: R02
  si:
    todos:
    - definicion: medicion_confirmada
    - dato: humedad_grano
      op: GT
      valor:
        param: humedad_base_max
    - dato: humedad_grano
      op: LTE
      valor:
        param: humedad_admision_max
  entonces:
    hallazgo: HUMEDAD_CONDICIONAL
    mensaje: Humedad confirmada {dato:humedad_grano} % b.h. está en la banda condicional
      (> {param:humedad_base_max} % y <= {param:humedad_admision_max} %).
  evidencias:
  - dato: humedad_grano
    op: GT
    valor:
      param: humedad_base_max
- id: R02-secado
  regla: R02
  si:
    todos:
    - hecho: HUMEDAD_CONDICIONAL
    - alguno:
      - contexto: tipo_almacenamiento
        igual: HERMETICO
      - es_verdadero:
          contexto: clima_calido
      - es_verdadero:
          calculo: dias_previstos_restantes
          op: GT
          valor:
            param: plazo_corto_max_dias
  entonces:
    hallazgo: SECADO_REQUERIDO_BANDA_CONDICIONAL
    solicitudes:
    - CORRECCION
    mensaje: 'La banda condicional no es admisible con almacenamiento hermético, clima
      cálido o plazo mayor de {param:plazo_corto_max_dias} días: secar hasta <= {param:humedad_base_max}
      %.'
    accion:
      codigo: CORREGIR
      descripcion: Secar hasta {param:humedad_base_max} % b.h. y reevaluar.
      responsable: PRODUCTOR
  evidencias:
  - dato: humedad_grano
    op: GT
    valor:
      param: humedad_base_max
- id: R03
  si:
    todos:
    - definicion: medicion_confirmada
    - dato: humedad_grano
      op: LTE
      valor:
        param: humedad_base_max
  entonces:
    hallazgo: HUMEDAD_APTA_BASE
    mensaje: Humedad confirmada {dato:humedad_grano} % b.h. dentro de la condición
      base. Este hecho no autoriza por sí solo.
  evidencias:
  - dato: humedad_grano
    op: LTE
    valor:
      param: humedad_base_max
- id: R04
  si:
    todos:
    - dato: aw_medida
    - dato: actividad_agua
      op: GTE
      valor:
        param: aw_alerta
  entonces:
    hallazgo: RIESGO_FUNGICO_HIDRICO
    solicitudes:
    - CORRECCION
    mensaje: Actividad de agua medida {dato:actividad_agua} alcanza o supera {param:aw_alerta}.
    accion:
      codigo: REVISION_TECNICA
      descripcion: Secado o evaluación técnica y nueva medición.
      responsable: TECNICO
  evidencias:
  - dato: actividad_agua
    op: GTE
    valor:
      param: aw_alerta
- id: R05
  si:
    todos:
    - alguno:
      - aportado: humedad_grano
      - aportado: metodo_humedad
    - es_falso:
        definicion: medicion_confirmada
  entonces:
    hallazgo: MEDICION_HUMEDAD_NO_CONFIRMADA
    solicitudes:
    - CORRECCION
    mensaje: 'La medición de humedad no está confirmada: corregir método, equipo,
      representatividad o acondicionamiento. Una estimación indirecta no sustenta
      R01–R03.'
    accion:
      codigo: CORREGIR
      descripcion: Repetir la medición con procedimiento y equipo verificados.
      responsable: PRODUCTOR
  evidencias:
  - dato: metodo_humedad
    op: EQ
    valor: INSTRUMENTAL
- id: R06
  si:
    todos:
    - dato: temperatura_almacen
      op: LT
      valor:
        param: temperatura_alerta
    - alguno:
      - todos:
        - contexto: tipo_almacenamiento
          igual: NO_HERMETICO
        - dato: hr_almacen
          op: LT
          valor:
            param: hr_almacen_max
      - todos:
        - contexto: tipo_almacenamiento
          igual: HERMETICO
        - definicion: integridad_hermetica
  entonces:
    hallazgo: AMBIENTE_BASE_APTO
    mensaje: Ambiente del almacén dentro de la condición base.
  evidencias:
  - dato: temperatura_almacen
    op: LT
    valor:
      param: temperatura_alerta
  - dato: hr_almacen
    op: LT
    valor:
      param: hr_almacen_max
- id: R07
  aplica_si:
    contexto: tipo_almacenamiento
    igual: NO_HERMETICO
  si:
    dato: hr_almacen
    op: GTE
    valor:
      param: hr_almacen_max
  entonces:
    hallazgo: RIESGO_REHUMEDECIMIENTO
    solicitudes:
    - CORRECCION
    mensaje: Humedad relativa del almacén {dato:hr_almacen} % alcanza o supera {param:hr_almacen_max}
      % en almacenamiento no hermético.
    accion:
      codigo: CORREGIR
      descripcion: Corregir la exposición a humedad del almacén.
      responsable: PRODUCTOR
  evidencias:
  - dato: hr_almacen
    op: GTE
    valor:
      param: hr_almacen_max
- id: R08
  si:
    alguno:
    - dato: temperatura_almacen
      op: GTE
      valor:
        param: temperatura_alerta
    - dato: temperatura_grano_aplicable
      op: GTE
      valor:
        param: temperatura_alerta
  entonces:
    hallazgo: RIESGO_TERMICO
    solicitudes:
    - CORRECCION
    mensaje: Temperatura de {param:temperatura_alerta} °C o más en el almacén o en
      el grano.
    accion:
      codigo: CORREGIR
      descripcion: Evaluar enfriamiento, revisar el grano y recalcular el tiempo.
      responsable: PRODUCTOR
  evidencias:
  - dato: temperatura_almacen
    op: GTE
    valor:
      param: temperatura_alerta
  - dato: temperatura_grano_aplicable
    op: GTE
    valor:
      param: temperatura_alerta
- id: R09
  aplica_si:
    aportado: temperatura_grano_previa
  si:
    todos:
    - es_verdadero:
        definicion: lecturas_termicas_comparables
    - diferencia:
      - temperatura_grano
      - temperatura_grano_previa
      op: GTE
      valor:
        param: aumento_termico_alerta
  entonces:
    hallazgo: PUNTO_CALIENTE_SOSPECHADO
    solicitudes:
    - CORRECCION
    mensaje: 'La temperatura del grano aumentó {diferencia:temperatura_grano,temperatura_grano_previa}
      °C en {horas:temperatura_grano,temperatura_grano_previa} horas. El aumento no
      confirma infestación ni actividad microbiana: exige inspección.'
    accion:
      codigo: REVISION_TECNICA
      descripcion: Inspeccionar varios puntos y buscar la causa del aumento.
      responsable: TECNICO
  evidencias:
  - dato: temperatura_grano
  - dato: temperatura_grano_previa
- id: R10
  aplica_si:
    contexto: tipo_almacenamiento
    igual: NO_HERMETICO
  si:
    todos:
    - es_verdadero:
        definicion: datos_aireacion_completos
    - dato: humedad_grano
      op: GT
      valor:
        dato: humedad_equilibrio_maiz
    - dato: hr_aire_exterior
      op: LT
      valor:
        param: hr_aireacion_max
    - negar:
        dato: lluvia_o_niebla
    - dato: temperatura_aire_exterior
      op: LTE
      valor:
        dato: temperatura_grano
  entonces:
    hallazgo: AIREACION_FAVORABLE
    mensaje: El aire exterior puede secar el grano sin aumentar su temperatura. La
      recomendación queda subordinada a la decisión final.
  evidencias:
  - dato: humedad_grano
    op: GT
    valor:
      dato: humedad_equilibrio_maiz
  - dato: hr_aire_exterior
    op: LT
    valor:
      param: hr_aireacion_max
  - dato: temperatura_aire_exterior
    op: LTE
    valor:
      dato: temperatura_grano
- id: R11
  aplica_si:
    contexto: tipo_almacenamiento
    igual: NO_HERMETICO
  si:
    alguno:
    - dato: humedad_grano
      op: LTE
      valor:
        dato: humedad_equilibrio_maiz
      descripcion: humedad del grano igual o menor que la de equilibrio
    - dato: hr_aire_exterior
      op: GTE
      valor:
        param: hr_aireacion_max
      descripcion: aire exterior demasiado húmedo
    - dato: lluvia_o_niebla
      descripcion: lluvia o niebla
    - dato: temperatura_aire_exterior
      op: GT
      valor:
        dato: temperatura_grano
      descripcion: aire exterior más cálido que el grano
  entonces:
    hallazgo: AIREACION_DESFAVORABLE
    mensaje: 'El aire exterior no permite airear sin riesgo de rehumedecer o calentar
      el grano: {soportes}. Con igualdad de humedad se adopta el criterio conservador.'
  evidencias:
  - dato: humedad_grano
    op: LTE
    valor:
      dato: humedad_equilibrio_maiz
  - dato: hr_aire_exterior
    op: GTE
    valor:
      param: hr_aireacion_max
  - dato: temperatura_aire_exterior
    op: GT
    valor:
      dato: temperatura_grano
- id: R12
  aplica_si:
    contexto: tipo_almacenamiento
    igual: HERMETICO
  si:
    todos:
    - hecho: HUMEDAD_APTA_BASE
    - es_verdadero:
        definicion: integridad_hermetica
  entonces:
    hallazgo: PROTECCION_HERMETICA_ACTIVA
    mensaje: 'Barrera comprobada con humedad en condición base: mantener sellado y
      usar control exterior. No demuestra eliminación de insectos.'
  evidencias:
  - dato: sello_integro
    op: EQ
    valor: true
- id: R13
  aplica_si:
    contexto: tipo_almacenamiento
    igual: HERMETICO
